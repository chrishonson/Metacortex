name: Verify MetaCortex

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm --prefix functions ci
      - run: python3 scripts/run-gate.py metacortex_typecheck
      - run: python3 scripts/run-gate.py metacortex_test
      - run: python3 scripts/run-gate.py metacortex_package
